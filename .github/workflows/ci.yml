name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: otpvault
          POSTGRES_USER: otpvault
          POSTGRES_PASSWORD: otpvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otpvault -d otpvault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        env:
          OTPVAULT_DB_URL: jdbc:postgresql://localhost:5432/otpvault
          OTPVAULT_DB_USER: otpvault
          OTPVAULT_DB_PASSWORD: otpvault
        run: ./mvnw -B verify
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact -v .

  dependency-scan:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Download backend SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-backend
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version
      - name: Scan dependencies for vulnerabilities
        run: trivy sbom application.cdx.json --severity HIGH,CRITICAL --exit-code 1 --no-progress
