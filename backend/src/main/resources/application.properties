spring.application.name=backend

spring.datasource.url=${OTPVAULT_DB_URL:jdbc:postgresql://localhost:5432/otpvault}
spring.datasource.username=${OTPVAULT_DB_USER:otpvault}
spring.datasource.password=${OTPVAULT_DB_PASSWORD:otpvault}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.forward-headers-strategy=framework

otpvault.jwt.secret=${OTPVAULT_JWT_SECRET:dev-only-insecure-secret-change-me-min-32-bytes}
otpvault.jwt.access-ttl-seconds=${OTPVAULT_JWT_ACCESS_TTL:900}
otpvault.security.require-https=${OTPVAULT_REQUIRE_HTTPS:false}

management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
