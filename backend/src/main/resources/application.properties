spring.application.name=backend
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${OTPVAULT_DB_URL:jdbc:postgresql://localhost:5432/otpvault}
spring.datasource.username=${OTPVAULT_DB_USER:otpvault}
spring.datasource.password=${OTPVAULT_DB_PASSWORD:otpvault}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.forward-headers-strategy=${OTPVAULT_FORWARD_HEADERS:none}

otpvault.jwt.secret=${OTPVAULT_JWT_SECRET:}
otpvault.jwt.access-ttl-seconds=${OTPVAULT_JWT_ACCESS_TTL:900}
otpvault.security.require-https=${OTPVAULT_REQUIRE_HTTPS:false}

management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
