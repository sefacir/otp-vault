spring.application.name=backend

spring.datasource.url=${OTPVAULT_DB_URL:jdbc:postgresql://localhost:5432/otpvault}
spring.datasource.username=${OTPVAULT_DB_USER:otpvault}
spring.datasource.password=${OTPVAULT_DB_PASSWORD:otpvault}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.forward-headers-strategy=none

otpvault.jwt.secret=test-only-secret-that-is-well-over-32-bytes-long
otpvault.jwt.access-ttl-seconds=900
otpvault.security.require-https=false

management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
