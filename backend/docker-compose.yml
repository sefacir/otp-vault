services:
  postgres:
    image: postgres:17-alpine
    container_name: otpvault-postgres
    environment:
      POSTGRES_DB: otpvault
      POSTGRES_USER: otpvault
      POSTGRES_PASSWORD: otpvault
    ports:
      - "5432:5432"
    volumes:
      - otpvault-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otpvault -d otpvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  otpvault-pgdata:
